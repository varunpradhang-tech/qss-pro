<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c1121f"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .sub { font: 600 24px Arial, sans-serif; fill: #111827; }
      .body { font: 20px Arial, sans-serif; fill: #263445; }
      .small { font: 17px Arial, sans-serif; fill: #263445; }
      .note { font: 700 18px Arial, sans-serif; fill: #9a3412; }
      .ok { font: 700 18px Arial, sans-serif; fill: #047857; }
      .bad { font: 700 18px Arial, sans-serif; fill: #b91c1c; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .beam { stroke: #f97316; stroke-width: 8; stroke-dasharray: 34 16; fill: none; stroke-linecap: butt; }
      .beamThin { stroke: #f97316; stroke-width: 5; stroke-dasharray: 28 14; fill: none; stroke-linecap: butt; }
      .found { stroke: #16a34a; stroke-width: 5; fill: none; }
      .missing { stroke: #c1121f; stroke-width: 5; stroke-dasharray: 16 12; fill: none; }
      .support { fill: #a3a3a3; stroke: #1f2937; stroke-width: 3; }
      .dim { stroke: #22c55e; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .redDim { stroke: #c1121f; stroke-width: 3; marker-start: url(#redArrow); marker-end: url(#redArrow); }
      .grid { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 8 10; }
      .callout { stroke: #1f6feb; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .redCallout { stroke: #c1121f; stroke-width: 3; marker-end: url(#redArrow); fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="50" y="58" class="title">QSS Pro: Point 2 and Point 3 Visual Explanation</text>
  <text x="50" y="92" class="body">These are review reasons, not quantity items. They tell us why the app must stop and fix reading before final quantity.</text>

  <rect x="50" y="130" width="620" height="700" class="panel"/>
  <text x="80" y="178" class="sub">Point 2: Beam face not paired</text>
  <text x="80" y="212" class="body">A beam should normally have two readable parallel faces.</text>

  <line x1="105" y1="310" x2="615" y2="310" class="beam"/>
  <line x1="105" y1="430" x2="285" y2="430" class="beam"/>
  <line x1="405" y1="430" x2="615" y2="430" class="beam"/>
  <rect x="295" y="270" width="95" height="205" class="support"/>
  <text x="304" y="382" class="small" fill="#111827">COLUMN / WALL</text>

  <line x1="105" y1="310" x2="615" y2="310" class="found"/>
  <line x1="105" y1="430" x2="285" y2="430" class="found"/>
  <line x1="405" y1="430" x2="615" y2="430" class="found"/>
  <path d="M292 430 L398 430" class="missing"/>
  <text x="118" y="288" class="ok">Face 1 found</text>
  <text x="112" y="462" class="ok">Face 2 found on both sides</text>
  <text x="232" y="520" class="bad">Gap at support: app must bridge only if same beam continues</text>
  <path d="M342 520 C345 480, 345 455, 345 430" class="redCallout"/>

  <line x1="105" y1="585" x2="615" y2="585" class="dim"/>
  <text x="242" y="565" class="ok">Correct beam run after support-gap bridge</text>
  <text x="80" y="650" class="body">If the app cannot match two parallel faces for the same beam run,</text>
  <text x="80" y="680" class="body">it marks the beam as BR review instead of guessing length.</text>
  <text x="80" y="725" class="note">Fix required: pair dotted/continuous faces, then bridge support gaps.</text>

  <rect x="730" y="130" width="620" height="700" class="panel"/>
  <text x="760" y="178" class="sub">Point 3: Dimension conflict</text>
  <text x="760" y="212" class="body">Geometry and written CAD dimension must agree.</text>

  <line x1="790" y1="310" x2="1270" y2="310" class="beam"/>
  <line x1="790" y1="430" x2="1270" y2="430" class="beam"/>
  <rect x="790" y="265" width="80" height="215" class="support"/>
  <rect x="1190" y="265" width="80" height="215" class="support"/>
  <line x1="830" y1="530" x2="1230" y2="530" class="dim"/>
  <text x="935" y="510" class="ok">Geometry span = 4.000 m</text>

  <line x1="880" y1="255" x2="1180" y2="255" class="redDim"/>
  <line x1="880" y1="260" x2="880" y2="315" class="missing"/>
  <line x1="1180" y1="260" x2="1180" y2="315" class="missing"/>
  <text x="925" y="238" class="bad">CAD dimension says 3.000 m</text>

  <path d="M1015 250 C980 285, 950 315, 920 345" class="redCallout"/>
  <text x="930" y="378" class="bad">Conflict: endpoints/value do not match beam faces</text>
  <text x="760" y="650" class="body">If difference is more than 30-40 mm, app must not finalize it.</text>
  <text x="760" y="680" class="body">It should either choose the aligned CAD dimension or mark review.</text>
  <text x="760" y="725" class="note">Fix required: validate every beam/panel against nearby dimension text.</text>

  <line x1="50" y1="860" x2="1350" y2="860" stroke="#cbd5e1"/>
  <text x="50" y="884" class="small">QSS Pro rule: final quantity unlocks only when these review cases are below the allowed limit.</text>
</svg>
